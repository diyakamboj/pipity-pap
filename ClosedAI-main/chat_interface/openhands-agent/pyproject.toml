[project]
name = "openhands-agent-service"
version = "0.1.0"
description = "Separate OpenHands SDK service that can back the chat interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openhands-sdk>=0.1.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.9.0",
]

[project.scripts]
openhands-agent = "agent_service:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent_service"]
