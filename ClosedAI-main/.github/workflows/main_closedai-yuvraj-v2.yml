name: Deploy ClosedAI to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: chat_interface

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: chat_interface/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js standalone application
        run: npm run build

      - name: Prepare standalone deployment
        run: |
          mkdir -p .next/standalone/.next

          if [ -d "public" ]; then
            cp -r public .next/standalone/public
          fi

          cp -r .next/static .next/standalone/.next/static

      - name: Verify standalone build
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/node_modules
          test -d .next/standalone/node_modules/next
          echo "Standalone Next.js build verified successfully"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: chat_interface/.next/standalone
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7B8137DFB0304495A386DBD792C94424 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4049685E6CB7468A9822B11869A4CE47 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_42A754469A6341C6AC45878FEB382921 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: closedai-yuvraj-v2
          slot-name: Production
          package: .
